name: release Windows desktop (Avalonia UI)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
    tags:
      - 'v*-xrvi*'

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      target: windows

  release-zip:
    if: inputs.release_tag != '' || github.ref_type == 'tag'
    needs: build
    uses: ./.github/workflows/package-zip.yml
    with:
      target: windows-desktop
      release_tag: ${{ inputs.release_tag || github.ref_name }}
    secrets: inherit

  build-aot:
    uses: ./.github/workflows/build.yml
    with:
      target: windows
      isAot: true

  release-aot-zip:
    if: inputs.release_tag != '' || github.ref_type == 'tag'
    needs: build-aot
    uses: ./.github/workflows/package-zip.yml
    with:
      target: windows-desktop
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      isAot: true
    secrets: inherit
